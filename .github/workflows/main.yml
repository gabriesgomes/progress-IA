name: WAP DevSecOps Progress Code Review

on:
  push:
    # O repositorio usa 'master'. 'main' fica listado para o caso de
    # renomeacao futura do branch padrao.
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  # Permite disparar a mao pela aba Actions, sem precisar de commit.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  review-code:
    # Runner self-hosted rodando no WSL local.
    runs-on: self-hosted

    steps:
      # 1. Baixa o codigo do repositorio
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Isola apenas o que mudou (funciona para push e para pull request)
      - name: Get PR Diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "🤖 Detectado: Evento de Pull Request"
            git fetch --all
            git diff origin/${{ github.base_ref }}...HEAD > pr.diff
          else
            echo "🚀 Detectado: Evento de Push"

            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              git diff HEAD~1 HEAD > pr.diff
            else
              git show HEAD > pr.diff
            fi
          fi

          echo "Tamanho do diff:"
          wc -c pr.diff

          echo "Primeiras linhas:"
          head -20 pr.diff

      # 2b. Materializa a chave SSH do servidor Progress a partir do secret.
      #     A chave nunca aparece no log: e escrita direto em arquivo com
      #     permissao 600 e apagada no fim do job.
      #     O contexto 'secrets' nao existe em 'if:' de step -- por isso a
      #     chave vem por env e o caso vazio e tratado aqui dentro.
      - name: Preparar chave SSH do servidor Progress
        env:
          CHAVE_SSH: ${{ secrets.PROGRESS_SSH_KEY }}
        run: |
          if [ -z "$CHAVE_SSH" ]; then
            echo "Secret PROGRESS_SSH_KEY nao definido."
            echo "A compilacao em modo ssh ficara indisponivel."
            exit 0
          fi

          mkdir -p "$GITHUB_WORKSPACE/.ssh-progress"
          chmod 700 "$GITHUB_WORKSPACE/.ssh-progress"
          printf '%s\n' "$CHAVE_SSH" > "$GITHUB_WORKSPACE/.ssh-progress/id_rsa"
          chmod 600 "$GITHUB_WORKSPACE/.ssh-progress/id_rsa"
          echo "Chave gravada ($(wc -c < "$GITHUB_WORKSPACE/.ssh-progress/id_rsa") bytes)"

      # 3. Auditoria estatica + validacao de SINTAXE pelo compilador Progress.
      #    Usa apenas a biblioteca padrao do Python -- nada a instalar.
      #    O resultado da compilacao e o portao da etapa 5.
      #
      #    >>> CONFIGURE AQUI O COMPILADOR <<<
      #    Basta preencher DLC e PROGRESS_PF e trocar PROGRESS_COMPILE
      #    para "1". Detalhes de cada variavel em progress_compilador.py.
      - name: Auditoria estatica e sintaxe (compilador Progress)
        id: estatica
        env:
          DIFF_FILE: pr.diff
          RELATORIO_FILE: code-check.md
          METRICAS_FILE: code-check-metrics.json

          # --- Compilador OpenEdge -------------------------------------
          # Troque para "1" quando o restante estiver preenchido.
          PROGRESS_COMPILE: "0"
          # "local" = OpenEdge no proprio runner.
          # "ssh"   = OpenEdge em outro servidor (caso desta instalacao).
          PROGRESS_EXEC_MODE: "ssh"

          # Caminhos NO SERVIDOR REMOTO quando o modo e ssh.
          # Raiz da instalacao OpenEdge. Ex.: /usr/dlc
          DLC: ""
          # Binario alternativo, se nao for $DLC/bin/_progres.
          PROGRES_BIN: ""
          # Arquivo .pf com a conexao ao banco. Sem banco, fonte que
          # referencia tabela nao compila.
          PROGRESS_PF: ""
          # Parametros extras. Ex.: "-cpinternal iso8859-1 -cpstream iso8859-1"
          PROGRESS_PARAMS: ""
          # PROPATH adicional (includes de produto fora do repositorio),
          # separado por virgula. A raiz dos fontes ja entra automaticamente.
          PROPATH: ""
          PROGRESS_TIMEOUT: "900"
          # "1" barra a IA tambem quando a compilacao nao pode ser executada.
          EXIGIR_COMPILACAO: "0"

          # --- Staging do r-code ---------------------------------------
          # "1" grava o .r; "0" apenas valida a sintaxe e descarta.
          PROGRESS_SAVE_RCODE: "0"
          # Diretorio de staging NO SERVIDOR. Precisa estar FORA do
          # PROPATH: o script recusa a gerar se detectar sobreposicao.
          # Ex.: /staging/rcode/wms
          PROGRESS_RCODE_DIR: ""
          # Permissao final. O padrao permite copiar e impede alterar.
          PROGRESS_RCODE_MODE_DIR: "755"
          PROGRESS_RCODE_MODE_FILE: "444"

          # --- Acesso SSH ao servidor Progress -------------------------
          PROGRESS_SSH_HOST: ${{ vars.PROGRESS_SSH_HOST }}
          PROGRESS_SSH_USER: ${{ vars.PROGRESS_SSH_USER }}
          PROGRESS_SSH_PORT: "22"
          # Caminho da chave privada NO RUNNER. Veja o step anterior, que
          # a materializa a partir do secret.
          PROGRESS_SSH_KEY: ${{ github.workspace }}/.ssh-progress/id_rsa
          PROGRESS_REMOTE_TMP: "/tmp"

          # --- Ruido do relatorio --------------------------------------
          LIMITE_POR_REGRA: "15"
          # Heuristica de blocos: falso positivo em massa nos .w do
          # AppBuilder. Desnecessaria quando o compilador esta ativo.
          CHECAR_BALANCEAMENTO: "0"
        run: |
          python3 "$GITHUB_WORKSPACE/.github/auditar_pr_sem_ia.py"

      # 4. Dependencia da etapa de IA. Ignora a trava da PEP 668.
      - name: Set up Python Dependencies
        if: steps.estatica.outputs.prosseguir_ia == 'true'
        run: |
          if python3 -c "import openai" 2>/dev/null; then
            echo "openai ja presente: $(python3 -c 'import openai; print(openai.__version__)')"
            exit 0
          fi

          if ! python3 -m pip --version >/dev/null 2>&1; then
            echo "::error::pip nao esta instalado neste runner."
            echo "Execute UMA VEZ no WSL, com a sua senha:"
            echo "    sudo apt update && sudo apt install -y python3-pip"
            exit 1
          fi

          python3 -m pip install openai --break-system-packages --quiet
          echo "openai instalado: $(python3 -c 'import openai; print(openai.__version__)')"

      # 5. Auditoria por IA no Databricks -- so roda se a sintaxe passou.
      - name: Auditoria por IA (Databricks)
        if: steps.estatica.outputs.prosseguir_ia == 'true'
        continue-on-error: true
        env:
          DIFF_FILE: pr.diff
          RELATORIO_FILE: code-check-ia.md
          METRICAS_FILE: code-check-ia-metrics.json

          # --- Databricks ----------------------------------------------
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_MODEL: ${{ vars.DATABRICKS_MODEL }}

          IA_TIMEOUT: "300"
          IA_MAX_TOKENS: "4096"

          # --- Custo e tamanho -----------------------------------------
          LIMITE_DIFF_IA: "60000"
          LIMITE_CONTEXTO_IA: "40"
          # Preco por milhao de tokens do endpoint. Preencha para o custo
          # aparecer correto no relatorio.
          CUSTO_ENTRADA_1M: "0"
          CUSTO_SAIDA_1M: "0"
        run: |
          echo "TOKEN=${DATABRICKS_TOKEN:+OK}"
          echo "HOST=${DATABRICKS_HOST:+OK}"
          echo "MODEL=${DATABRICKS_MODEL:+OK}"
          python3 "$GITHUB_WORKSPACE/.github/auditar_pr_com_ia.py"

      # 6. Remove a chave SSH do disco do runner. Runner self-hosted nao
      #    descarta o workspace entre jobs, entao a limpeza e necessaria.
      - name: Remover chave SSH
        if: always()
        run: |
          rm -rf "$GITHUB_WORKSPACE/.ssh-progress"

      # 7. Publica os relatorios gerados
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-check
          path: |
            code-check.md
            code-check-metrics.json
            code-check-ia.md
            code-check-ia-metrics.json
          if-no-files-found: warn

      - name: Publish Summary
        if: always()
        run: |
          echo "### Status da sintaxe: \`${{ steps.estatica.outputs.compilacao_status }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f code-check.md ]; then
            cat code-check.md >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f code-check-ia.md ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "---" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            cat code-check-ia.md >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> Etapa de IA nao executada (sintaxe nao liberou o portao)." >> $GITHUB_STEP_SUMMARY
          fi
